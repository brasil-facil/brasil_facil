# Comparison countries (technical design, "Comparison countries", decided 16 Oct 2026).
# reference: the grey line that is always shown. peer: a button under the chart;
# up to three peers can be switched on at once, default_on ones start switched on.
# short: the name at the end of the line on a phone, where space is tight.
OECD:
  name: {pt: Média da OCDE, en: OECD average}
  short: {pt: OCDE, en: OECD}
  role: reference
G110:   # IMF group "advanced economies": the yearly stand-in for the OECD average
  name: {pt: Economias avançadas, en: Advanced economies}
  short: {pt: Avançadas, en: Advanced}
  role: reference
G205:   # IMF group "Latin America and the Caribbean": the regional average for growth
  name: {pt: América Latina e Caribe, en: Latin America and the Caribbean}
  short: {pt: Am. Latina, en: Latin America}
  role: reference
MEX:
  name: {pt: México, en: Mexico}
  role: peer
  default_on: true
COL:
  name: {pt: Colômbia, en: Colombia}
  role: peer
  default_on: true
ZAF:
  name: {pt: África do Sul, en: South Africa}
  short: {pt: Áfr. do Sul, en: S. Africa}
  role: peer
USA:
  name: {pt: EUA, en: USA}
  role: peer
