# Section pages: which indicators go in which glass box, in this order.
# The reader texts (titles, intros) are in content/<lang>/<section>/index.md.
# Decided 23 Oct 2026.
economia:
  groups:
    - id: trabalho
      indicators: [desemprego, salario-minimo, renda]
    - id: precos-juros
      indicators: [inflacao, inpc, selic, juro-real, nivel-de-precos]
    - id: producao
      indicators: [crescimento, pib-per-capita, conta-corrente]
# Plan "Dinheiro público" (9 Nov 2026). First step: debt, primary balance and
# interest; the other groups get their indicators in the next steps.
dinheiro-publico:
  groups:
    - id: divida-juros
      indicators: [divida, resultado-primario, juros-da-divida]
