id: inflacao
section: economia
group: lagging
name:
  pt: Aumento dos preços - Inflação
  en: Increase in prices - Inflation
slug:                     # the page address: /pt/economia/inflacao/ and /en/economy/inflation/
  pt: inflacao
  en: inflation
technical_name: IPCA, acumulado em 12 meses
unit: percent
series:
  brazil: {source: sidra, code: "1737-v2265", geo: BRA}
  peers:   # decided 21 Oct 2026: IMF is the most current for the named countries
    - {source: imf, code: cpi-yoy, geo: [MEX, COL, ZAF, USA], source_name: FMI}
    - {source: oecd, code: cpi-yoy, geo: [OECD], source_name: OCDE}
source:                   # shown under the chart, with a link to the original table
  name: IBGE
  table: IPCA, tabela 1737
  url: https://sidra.ibge.gov.br/tabela/1737
transform: none
zones:
  rule: band
  target: meta-inflacao   # data/targets/meta-inflacao.csv: green = lower to upper
  yellow_margin: 1.5      # Brasil Fácil rule: up to 1.5 points outside the official band
  basis: official_target
chart:
  show_from: "1995-06"    # first 12-month window entirely after the Plano Real (Jul 1994)
related: inpc             # "Brasil agora" also shows the INPC, with a link (text: related_note)
release:
  expected_day: 10
  stale_after_days: 45
content: inflacao
