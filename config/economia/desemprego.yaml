transform: none
zones:
  # Decided 21 Oct 2026. No official body (ILO, OECD, IBGE) sets a threshold, so
  # this is Brasil Fácil's rule. The rate is compared with the same months one
  # year earlier, which cancels out the seasons (IBGE does not adjust for them).
  # On 2012-2026 data it is red only in 2015-2017 and 2020-2021.
  rule: change_from_year_before
  basis: brasilfacil_rule
  green_below: 0.2   # a rise of less than 0.2 point counts as stable
  red_from: 0.5      # 0.5 point: the recession signal of the Sahm rule
  citation: "Claudia Sahm (2019), Sahm rule; adapted to year-on-year change by Brasil Fácil"
  checked_on: 2026-10-21
release:
  expected_day: 30
  stale_after_days: 45
