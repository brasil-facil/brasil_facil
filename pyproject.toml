[project]
name = "brasil_facil"
version = "0.1.0"
description = "Brazilian indicators in simple terms/Indicadores brasileiros em termos simples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

