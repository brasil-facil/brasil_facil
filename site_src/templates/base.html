<!doctype html>
<html lang="{{ s.html_lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Brasil Fácil{% endblock %}</title>
    <link rel="alternate" hreflang="{{ s.other_lang }}" href="{{ other_url }}">
    <link rel="icon" href="/static/brand/brasil-facil-simbolo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <script>
      // Apply the reader's saved look before the page is drawn, so it never flashes.
      try {
        var look = localStorage.getItem("bf-theme");
        if (look === "light" || look === "dark") document.documentElement.dataset.theme = look;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner glass">
        <a class="logo" href="/{{ lang }}/">
          <img class="on-light" src="/static/brand/brasil-facil-logo.svg" alt="Brasil Fácil" width="154" height="36">
          <img class="on-dark" src="/static/brand/brasil-facil-logo-branco.svg" alt="Brasil Fácil" width="154" height="36">
        </a>
        <div class="tools">
          <a class="lang-switch" href="{{ other_url }}" hreflang="{{ s.other_lang }}" lang="{{ s.other_lang }}">{{ s.other_lang_name }}</a>
          <div class="seg theme-switch" role="group" aria-label="{{ s.theme_label }}">
            <button type="button" data-theme-choice="dark" aria-pressed="false">{{ s.theme_dark }}</button>
            <button type="button" data-theme-choice="light" aria-pressed="false">{{ s.theme_light }}</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Brasil Fácil · {{ s.site_tagline }}</p>
      <p>{{ s.footer_contact }}: <a href="mailto:contato@brasilfacil.org">contato@brasilfacil.org</a></p>
    </footer>
    <script src="/static/theme.js" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
