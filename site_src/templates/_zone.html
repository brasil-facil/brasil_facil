{# A zone pill: always an icon AND a word, never colour alone. #}
{% macro zone_pill(zone, s) %}
  {% if zone == "green" %}
    <span class="pill good"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7.2 L6.2 9.3 L10 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>{{ s.zone_green }}</span>
  {% elif zone == "yellow" %}
    <span class="pill watch"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 L13 12.5 H1 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="7" y1="5.5" x2="7" y2="8.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="7" cy="10.6" r="1" fill="currentColor"/></svg>{{ s.zone_yellow }}</span>
  {% elif zone == "red" %}
    <span class="pill bad"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="4.6" y1="4.6" x2="9.4" y2="9.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9.4" y1="4.6" x2="4.6" y2="9.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>{{ s.zone_red }}</span>
  {% else %}
    <span class="pill none">{{ s.zone_none }}</span>
  {% endif %}
{% endmacro %}
